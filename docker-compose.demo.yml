# Try AJPWER Workforce with sample data — nothing to configure, no .env needed.
#
#   docker compose -f docker-compose.demo.yml up --build
#   then open http://localhost:4000 and sign in: hr@ajpwer.in / Demo@12345
#
# The first start loads about 30 sample people with four months of attendance:
# two months already paid, last month ready to run, and this month in progress.
# See DEMO.md for a guided tour.
#
# Start again with fresh sample data:
#   docker compose -f docker-compose.demo.yml down -v
#   docker compose -f docker-compose.demo.yml up --build
#
# DEMO ONLY: the passwords and keys below are public. Never put real employee
# data in this setup — use docker-compose.yml with your own .env for that.
name: ajpwer-demo

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: ajpwer_demo
      TZ: UTC
      PGTZ: UTC
    volumes:
      - demo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d ajpwer_demo"]
      interval: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      WEB_ORIGIN: http://localhost:${DEMO_PORT:-4000}
      COOKIE_SECURE: "false"
      DATABASE_URL: postgresql://demo:demo@db:5432/ajpwer_demo?schema=public
      # No Redis: payroll runs and exports run inside the app process.
      JWT_SECRET: demo-only-jwt-secret-not-for-real-use
      SITE_JWT_SECRET: demo-only-site-secret-not-for-real-use
      PII_ENCRYPTION_KEY: ZGVtby1vbmx5LXBpaS1rZXktMzItYnl0ZXMtbG9uZyE=
      ADMIN_EMAIL: hr@ajpwer.in
      ADMIN_PASSWORD: Demo@12345
      ADMIN_NAME: HR Admin
      COMPANY_NAME: AJ Power Engineering (demo)
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
    # Apply migrations, load the sample data on the first start only, then serve the app.
    command:
      - sh
      - -c
      - >-
        npx prisma migrate deploy --schema apps/api/prisma/schema.prisma &&
        npx tsx apps/api/prisma/seed.ts &&
        node apps/api/dist/server.js
    ports:
      - "${DEMO_PORT:-4000}:4000"
    volumes:
      - demo-appdata:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  demo-pgdata:
  demo-appdata:
