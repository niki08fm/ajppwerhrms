name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  # Test-only secrets. Real values live in the deployment environment, never in the repository.
  JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret
  SITE_JWT_SECRET: ci-site-secret-ci-site-secret-ci-site
  PII_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  ADMIN_EMAIL: hr@ajpwer.in
  ADMIN_PASSWORD: ci-admin-password
  FACE_SERVICE_URL: http://127.0.0.1:8100
  FACE_SERVICE_TOKEN: ci-face-token-ci-face-token-ci-face

jobs:
  face-service:
    name: Face service (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r face/service/requirements-dev.txt
      - run: cd face/service && python -m pytest

  test:
    name: Typecheck, tests, build
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ajpwer_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ajpwer_test?schema=public
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL 16 comes installed on GitHub's Ubuntu runners: start it, no containers.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do pg_isready -h localhost && break; sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb ajpwer_test
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema backend/prisma/schema.prisma
      - name: Engine acceptance tests (spec §20)
        run: npm run test:engines
      - name: API integration tests (spec §20.25–31)
        run: npm run test:api
      - name: Build
        run: npm run build
      - name: Dependency scan
        run: npm audit --omit=dev --audit-level=high

  load:
    name: Performance budgets (spec §15, §20.34)
    runs-on: ubuntu-24.04
    needs: test
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ajpwer_load?schema=public
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL 16 comes installed on GitHub's Ubuntu runners: start it, no containers.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do pg_isready -h localhost && break; sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb ajpwer_load
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema backend/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema backend/prisma/schema.prisma
      - name: Seed, then 200 employees and three years of punches
        run: npm run db:seed && npm run db:seed:load
      - name: Budgets
        run: npm run test:load

  e2e:
    name: Browser flows (Playwright)
    runs-on: ubuntu-24.04
    needs: test
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ajpwer?schema=public
      E2E_PASSWORD: ci-admin-password
      PW_USE_BUNDLED: '1'
    steps:
      - uses: actions/checkout@v4
      # PostgreSQL 16 comes installed on GitHub's Ubuntu runners: start it, no containers.
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 30); do pg_isready -h localhost && break; sleep 1; done
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb ajpwer
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'
      - run: npx prisma generate --schema backend/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema backend/prisma/schema.prisma
      - run: npm run db:seed
      - name: Start API and web
        run: |
          (cd backend && node src/server.js > ../api.log 2>&1 &)
          (cd frontend && npx vite --port 5173 > ../web.log 2>&1 &)
          npx wait-on -t 60000 http://localhost:4000/api/v1/health http://localhost:5173
      - run: npm run test:e2e
      - if: failure()
        run: tail -100 api.log web.log
